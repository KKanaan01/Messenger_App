<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Socket.IO Test Chat</title>
    <link href="./styles.css" rel="stylesheet">
  </head>

  <body>
    <div class="wrap">
      <h2>Socket.IO Test Chat</h2>
      <div class="meta">
        Open this page on multiple devices. If messages show up everywhere, you’re golden.
      </div>

      <div id="chat"></div>
      <div class="row">
        <input id="name" placeholder="Name (ex: Batman)" />
        <input id="room" placeholder="Room (ex: lobby)" value="lobby" />
        <button id="joinBtn">Join</button>
      </div>

      <div class="row">
        <input id="msg" placeholder="Type a message..." />
        <button id="sendBtn">Send</button>
      </div>
    </div>
    <!-- Socket.IO client served by your server automatically at /socket.io/socket.io.js -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="./chat.js"></script>
  </body>
</html>
